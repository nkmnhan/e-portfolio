<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43e0f7"/>
      <stop offset="100%" stop-color="#7649fe"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="31" height="31" x="0.5" y="0.5" rx="5.5" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <!-- Terminal prompt > -->
  <path d="M7 10 L14 16 L7 22" fill="none" stroke="url(#glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor _ -->
  <line x1="17" y1="22" x2="25" y2="22" stroke="#43e0f7" stroke-width="2.5" stroke-linecap="round"/>
</svg>
